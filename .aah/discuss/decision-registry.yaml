decisions:
- slug_id: local-storage-strategy
  area: Data & Storage
  question: How should raw video and processed clips be stored on device?
  options_presented:
  - persistent-indefinite
  - transient-delete-after-export
  - hybrid-48h-ttl
  options_eliminated: []
  response: hybrid-48h-ttl
  response_type: single-select
  source: user
  activates: []
  notes: 'User chose hybrid: raw video kept 48h in app-private storage with auto-delete
    via WorkManager TTL job; processed clips exported to MediaStore gallery permanently;
    analytics computed on demand from pointLog (no caching needed given small size
    ~167 entries)'
- slug_id: cloud-vs-local
  area: Deployment
  question: Where will this system run?
  options_presented:
  - cloud
  - local
  options_eliminated: []
  response: local
  response_type: single-select
  source: inferred
  activates: []
  notes: On-device Android app; Firebase backend already exists and is not new infrastructure.
    No cloud video processing.
