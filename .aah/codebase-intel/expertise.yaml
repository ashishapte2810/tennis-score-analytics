tech_patterns:
  firestore_realtime_sync:
    tool: "Firebase Firestore"
    pattern: "Whole-document replace via stateJson blob. Phone uses onSnapshot; watch uses addSnapshotListener as a Kotlin Flow. Each client skips updates it generated (updatedBy guard)."
    injection: "FirestoreRepository.kt on watch; Firebase JS SDK compat v10.12.0 loaded from CDN on phone."
  jetpack_compose_wear:
    tool: "Wear Compose Material 1.3.0 + ViewModel"
    pattern: "Stateless Compose screens receive state from MatchViewModel via collectAsStateWithLifecycle. Navigation is handled by Wear Compose Navigation."
    injection: "MainActivity sets up NavHost; ViewModel is scoped to the NavBackStackEntry."
  coroutine_flows:
    tool: "Kotlinx Coroutines 1.7.3"
    pattern: "Firestore listeners converted to Flow via callbackFlow; collected in ViewModel with viewModelScope. All async Firestore/Auth calls use .await() from kotlinx-coroutines-play-services."
    injection: "viewModelScope.launch in MatchViewModel; lifecycleScope in MainActivity."
  pwa_single_file:
    tool: "Vanilla HTML/CSS/JS"
    pattern: "Entire phone app in one file — no build step, no bundler, no imports. Firebase SDK loaded from CDN. Service worker (v11) provides cache-first installs."
    injection: "Deployed raw to Firebase Hosting via firebase deploy."
  google_signin:
    tool: "Firebase Auth + Google Sign-In"
    pattern: "Phone: signInWithPopup → redirect fallback. Watch: silent sign-in attempt → full GoogleSignIn intent. Both exchange Google ID token for Firebase credential."
    injection: "AuthRepository.kt on watch; inline Firebase Auth JS on phone."

integrations:
  - "Firebase Firestore: real-time match sync via stateJson doc writes + onSnapshot/Flow listeners on both clients"
  - "Firebase Auth (Google provider): shared uid links phone and watch to same Firestore data"
  - "Firebase Hosting: CDN delivery of PWA at tennis-score-analytics.web.app"
  - "Android Wearable Data Layer: one-way match ID push from phone to watch at match start (path /match, key matchId)"

